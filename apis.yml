name: Tacto
description: >-
  Tacto (Tacto Technology GmbH) is a Munich-based AI procurement intelligence
  platform for manufacturing companies. It unifies internal ERP and engineering
  data with external market intelligence to power AI agents that automate
  procurement work across four areas: Supplier Intelligence (centralized supplier
  management with documents, evaluations and performance data), Spend & Cost
  Intelligence (spend analysis and savings identification), Sourcing Intelligence
  (AI-optimized RFQ and price inquiries) and Compliance Intelligence (automated
  regulatory and supply-chain due-diligence detection). Tacto is ISO/IEC 27001:2022
  certified and GDPR compliant with EU-only hosting and an audit log of every AI
  action. It does not publish a public API or developer program; this profile
  captures the company's corporate, security and compliance surface.
